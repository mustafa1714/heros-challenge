<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الأبطال</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            min-height: 100vh;
        }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .circle-progress { transform: rotate(-90deg); transform-origin: 50% 50%; }
        .btn-option { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-option:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Container -->
    <div id="main-container" class="w-full max-w-xl bg-white rounded-[2.5rem] shadow-2xl p-6 md:p-8 relative overflow-hidden animate-pop">
        
        <!-- Decoration Elements -->
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-yellow-200 rounded-full blur-3xl opacity-40"></div>
        <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-blue-200 rounded-full blur-3xl opacity-40"></div>

        <!-- 1. Entry Screen -->
        <div id="entry-screen" class="text-center space-y-6">
            <div class="text-6xl mb-4">⭐</div>
            <h1 class="text-3xl font-black text-blue-600 leading-tight">مرحباً بك في تحدي الأبطال!</h1>
            <p class="text-gray-500 text-lg">اكتب اسمك يا بطل لتبدأ الرحلة</p>
            <div class="space-y-4">
                <input type="text" id="student-name" placeholder="اسمك الثلاثي هنا..." 
                    class="w-full p-4 text-center text-xl border-4 border-blue-100 rounded-2xl focus:border-blue-400 focus:outline-none transition-all">
                <button onclick="checkEligibility()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-black py-4 px-8 rounded-2xl text-xl shadow-lg transform active:scale-95 transition-all">
                    انطلق الآن! 🚀
                </button>
            </div>
        </div>

        <!-- 2. Already Taken Screen -->
        <div id="already-taken-screen" class="hidden text-center space-y-6">
            <div class="text-7xl mb-4">🚫</div>
            <h2 class="text-2xl font-black text-red-500">عفواً يا بطل!</h2>
            <p class="text-gray-600 text-lg leading-relaxed">لقد قمت بإنهاء هذا الاختبار مسبقاً. لا يمكن إعادة المحاولة لضمان الأمانة، بالتوفيق في التحديات القادمة!</p>
        </div>

        <!-- 3. Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-6 bg-blue-50 p-3 rounded-2xl">
                <span class="text-blue-600 font-bold text-lg">السؤال: <span id="q-counter">1</span>/10</span>
                <span id="player-label" class="text-blue-400 font-bold"></span>
            </div>
            
            <h3 id="question-text" class="text-2xl font-bold text-gray-800 mb-8 min-h-[80px] text-center leading-snug"></h3>
            
            <div id="options-grid" class="grid grid-cols-1 gap-4">
                <!-- Buttons injected here -->
            </div>
        </div>

        <!-- 4. Result Screen -->
        <div id="result-screen" class="hidden text-center space-y-6">
            <h2 class="text-3xl font-black text-blue-700">نتيجتك النهائية</h2>
            
            <!-- Progress Circle -->
            <div class="relative inline-flex items-center justify-center">
                <svg class="w-48 h-48">
                    <circle cx="96" cy="96" r="80" stroke="currentColor" stroke-width="12" fill="transparent" class="text-gray-100" />
                    <circle id="progress-circle" cx="96" cy="96" r="80" stroke="currentColor" stroke-width="12" fill="transparent" 
                        stroke-dasharray="502.6" stroke-dashoffset="502.6" class="text-green-500 circle-progress" stroke-linecap="round" />
                </svg>
                <div class="absolute text-4xl font-black text-gray-800" id="percentage-text">0%</div>
            </div>

            <div class="bg-gray-50 rounded-3xl p-6 border-2 border-dashed border-gray-200">
                <p class="text-xl font-bold text-gray-700 mb-2">البطل: <span id="final-name" class="text-blue-600 underline"></span></p>
                <p id="motivational-msg" class="text-lg text-gray-600 italic font-medium"></p>
            </div>

            <p class="text-sm text-gray-400">💡 التقط صورة للشاشة وأرسلها لمعلمك الآن!</p>
        </div>
    </div>

    <script>
        // --- 50 Questions Bank ---
        const questionBank = [
            // سورة النصر
            { q: "كم عدد آيات سورة النصر؟", a: ["3 آيات", "5 آيات", "7 آيات"], c: 0 },
            { q: "سورة النصر هي سورة...", a: ["مكية", "مدنية", "بحرية"], c: 1 },
            { q: "ترتيب سورة النصر في المصحف هو الرقم...", a: ["110", "114", "100"], c: 0 },
            { q: "عدد كلمات سورة النصر هو...", a: ["15 كلمة", "19 كلمة", "25 كلمة"], c: 1 },
            { q: "نزلت سورة النصر بعد سورة...", a: ["الفلق", "الإخلاص", "الكافرون"], c: 2 },
            { q: "ما معنى 'الفتح' في السورة؟", a: ["فتح القفل", "فتح مكة", "فتح الكتاب"], c: 1 },
            { q: "ما معنى كلمة 'أفواجاً'؟", a: ["جماعات كثيرة", "واحداً واحداً", "أشخاص قليلون"], c: 0 },
            { q: "بماذا أمر الله النبي ﷺ عند النصر؟", a: ["بالنوم", "بالتسبيح والاستغفار", "بالرحيل"], c: 1 },
            { q: "سورة النصر كانت علامة على قرب...", a: ["عيد الفطر", "وفاة النبي ﷺ", "نزول المطر"], c: 1 },
            { q: "لماذا سميت سورة النصر بهذا الاسم؟", a: ["لأنها ذكرت نصر الله", "لأنها قصيرة", "لأنها جميلة"], c: 0 },
            { q: "ما معنى 'فسبح بحمد ربك'؟", a: ["قل سبحان الله وبحمده", "اجرِ بسرعة", "اكتب الدروس"], c: 0 },
            { q: "ما معنى 'واستغفره'؟", a: ["اطلب منه المغفرة", "اطلب منه الطعام", "اطلب منه النجاح"], c: 0 },
            { q: "الله سبحانه 'تواباً' تعني أنه...", a: ["كثير التوبة والمغفرة", "يعاقب المخطئين", "يحب الصمت"], c: 0 },
            { q: "أين نزلت سورة النصر؟", a: ["في مكة قبل الهجرة", "في المدينة المنورة", "في الطائف"], c: 1 },
            { q: "الناس دخلوا في دين الله أفواجاً بعد...", a: ["فتح مكة", "غزوة أحد", "هجرة الحبشة"], c: 0 },
            // الحديث الشريف
            { q: "من هو راوي حديث بر الوالدين؟", a: ["أبو بكر الصديق", "أبو هريرة", "عمر بن الخطاب"], c: 1 },
            { q: "من أحق الناس بحسن الصحبة؟", a: ["الأب", "الأم", "المعلم"], c: 1 },
            { q: "كم مرة كرر النبي ﷺ كلمة 'أمك'؟", a: ["مرة واحدة", "مرتين", "ثلاث مرات"], c: 2 },
            { q: "ماذا تعني 'حسن الصحبة'؟", a: ["الرفق واللين", "الغضب بسرعة", "الهروب"], c: 0 },
            { q: "لماذا الأم أحق بالبر 3 مرات؟ لأنها تعبت في...", a: ["الطبخ", "الحمل والوضع والرضاعة", "التنظيف"], c: 1 },
            { q: "متى ذكر النبي ﷺ 'أبوك' في الحديث؟", a: ["المرة الأولى", "المرة الرابعة", "المرة الثانية"], c: 1 },
            { q: "الحديث مروي في 'متفق عليه' أي رواه...", a: ["البخاري ومسلم", "أحمد والترمذي", "النسائي"], c: 0 },
            { q: "ما معنى 'الوهن' الذي يصيب الأم؟", a: ["القوة", "الضعف والتعب", "السرعة"], c: 1 },
            { q: "بر الوالدين يأتي في الأهمية مباشرة بعد...", a: ["الصلاة", "توحيد الله", "الصدقة"], c: 1 },
            { q: "تكرار كلمة 'أمك' هو تأكيد على...", a: ["عظم حقها", "صغر سنها", "اسمها"], c: 0 },
            // أمثلة الصحابة
            { q: "رأى ابن عمر رجلاً يحمل أمه حول الكعبة، هل وفى حقها؟", a: ["نعم تماماً", "ولا بطلقة واحدة", "وفى نصف حقها"], c: 1 },
            { q: "من هو الصحابي الذي كان يدعو لأمه عند باب البيت؟", a: ["خالد بن الوليد", "أبو هريرة", "حمزة"], c: 1 },
            { q: "ماذا كان يفعل محمد بن المنكدر لأمه؟", a: ["يدلك قدمها", "يشتري لها ذهباً", "يتركها"], c: 0 },
            { q: "لماذا لم يأكل زين العابدين مع أمه في طبق واحد؟", a: ["لأنه شبعان", "خوفاً أن يسبق يدها لشيء اشتهته", "لأن الطبق صغير"], c: 1 },
            { q: "سمع النبي ﷺ صوت حارثة بن النعمان يقرأ في...", a: ["المسجد", "الجنة", "السوق"], c: 1 },
            { q: "بأي سبب دخل حارثة بن النعمان الجنة؟", a: ["بكثرة ماله", "ببره لأمه", "بشجاعته"], c: 1 },
            { q: "ما معنى 'الزفرة الواحدة' التي ذكرها ابن عمر؟", a: ["طلقة من آلام الولادة", "نسمة هواء", "خطوة واحدة"], c: 0 },
            { q: "أيهما فضل محمد بن المنكدر؟", a: ["قيام الليل", "تدليك قدم أمه", "السهر مع الأصدقاء"], c: 1 },
            { q: "كان أبو هريرة يقول لأمه: رحمك الله كما...", a: ["أعطيتني المال", "ربيتني صغيراً", "علمتني السباحة"], c: 1 },
            { q: "بر الوالدين هو...", a: ["طاعتهم في المعروف", "مخالفتهم", "تجاهلهم"], c: 0 },
            // دعاء السوق
            { q: "أين ورد دعاء دخول السوق؟", a: ["صحيح البخاري", "سنن الترمذي", "مسند أحمد"], c: 1 },
            { q: "كم حسنة يكتبها الله لمن قرأ دعاء السوق؟", a: ["ألف حسنة", "مليون حسنة", "مئة حسنة"], c: 1 },
            { q: "ما معنى 'يحيي ويميت'؟", a: ["هو الخالق المتحكم في الحياة", "اسم من أسماء الملائكة", "كلمة عادية"], c: 0 },
            { q: "ما هي الجائزة الثالثة لدعاء السوق غير الحسنات ومحو السيئات؟", a: ["بيت في الجنة", "رفع مليون درجة", "زيادة المال"], c: 1 },
            { q: "دعاء السوق يبدأ بـ...", a: ["سبحان الله", "الحمد لله", "لا إله إلا الله وحده لا شريك له"], c: 2 },
            { q: "من روى دعاء السوق عن النبي ﷺ؟", a: ["عبد الله بن عمر", "عائشة", "أبو بكر"], c: 0 },
            { q: "بيده الخير وهو على كل شيء...", a: ["بصير", "عليم", "قدير"], c: 2 },
            { q: "الدعاء يقول: 'وهو حي لا...'", a: ["ينام", "يموت", "ينسى"], c: 1 },
            { q: "كم سيئة يمحوها الله بدعاء السوق؟", a: ["ألف سيئة", "عشرة آلاف", "مليون سيئة"], c: 2 },
            { q: "لماذا أجر دعاء السوق عظيم؟", a: ["لأن الناس في غفلة في السوق", "لأن السوق مكان واسع", "لأنه طويل"], c: 0 },
            // متنوعة
            { q: "سورة النصر تدعو النبي ﷺ لـ 'الاستغفار'، وهذا يعلمنا...", a: ["التواضع لله دائماً", "أننا نخطئ كثيراً", "الحزن"], c: 0 },
            { q: "الصحابة كانوا يتسابقون في...", a: ["بر الوالدين", "جمع المال", "النوم"], c: 0 },
            { q: "كلمة 'فسبح' تعني...", a: ["السباحة في الماء", "تنزيه الله وذكره", "اللعب"], c: 1 },
            { q: "ما معنى 'فوج'؟", a: ["مجموعة كبيرة", "شخص واحد", "طير"], c: 0 },
            { q: "إرضاء الوالدين هو طريق لـ...", a: ["الجنة", "السفر", "التعب"], c: 0 }
        ];

        let quizQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let studentName = "";

        // Check if already taken on load
        window.onload = () => {
            if (localStorage.getItem('hero_quiz_completed')) {
                document.getElementById('entry-screen').classList.add('hidden');
                document.getElementById('already-taken-screen').classList.remove('hidden');
            }
        };

        function checkEligibility() {
            studentName = document.getElementById('student-name').value.trim();
            if (studentName.length < 3) {
                alert("برجاء كتابة اسمك الحقيقي يا بطل!");
                return;
            }
            
            // Start Game
            document.getElementById('entry-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('player-label').innerText = studentName;
            
            // Pick 10 random
            quizQuestions = questionBank.sort(() => 0.5 - Math.random()).slice(0, 10);
            showQuestion();
        }

        function showQuestion() {
            const q = quizQuestions[currentIndex];
            document.getElementById('q-counter').innerText = currentIndex + 1;
            document.getElementById('question-text').innerText = q.q;
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            q.a.forEach((option, idx) => {
                const btn = document.createElement('button');
                btn.className = "btn-option bg-white border-4 border-blue-100 hover:border-blue-400 p-4 rounded-2xl text-lg font-bold text-gray-700 text-right";
                btn.innerText = option;
                btn.onclick = () => selectOption(idx);
                grid.appendChild(btn);
            });
        }

        function selectOption(idx) {
            if (idx === quizQuestions[currentIndex].c) {
                score++;
            }
            
            currentIndex++;
            if (currentIndex < 10) {
                showQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            localStorage.setItem('hero_quiz_completed', 'true');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const percentage = (score / 10) * 100;
            document.getElementById('final-name').innerText = studentName;
            document.getElementById('percentage-text').innerText = percentage + "%";
            
            // Progress Circle Logic
            const circle = document.getElementById('progress-circle');
            const radius = 80;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (percentage / 100) * circumference;
            circle.style.strokeDashoffset = offset;

            // Motivational Message
            const msg = document.getElementById('motivational-msg');
            if (percentage === 100) {
                msg.innerText = "أنت أسطورة حقيقية! ذكاء خارق وإيمان قوي، المعلم فخور بك جداً! 🌟";
                msg.className += " text-green-600";
            } else if (percentage >= 80) {
                msg.innerText = "عمل رائع يا بطل المتميز! استمر في التألق والنجاح. 🚀";
                msg.className += " text-blue-600";
            } else if (percentage >= 50) {
                msg.innerText = "أحسنت يا شجاع، لكن يمكنك أن تصبح أفضل. راجع المعلومات مرة أخرى! 📚";
                msg.className += " text-orange-600";
            } else {
                msg.innerText = "لا بأس يا بطل، المحاولة هي طريق النجاح. اقرأ السيرة والحديث أكثر وستنجح! 💪";
                msg.className += " text-red-600";
            }
        }
    </script>
</body>
</html>
